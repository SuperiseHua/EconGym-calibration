# Stage-2 control baseline, not an estimated US household policy.
# Same 2022 policy/data mapping as real_society; freeze labor and technology shocks.
Environment:
  env_core:
    problem_scene: real_society_calibration
    episode_length: 27
    estate_tax_exemption: 12060000
  Entities:
    - entity_name: government
      entity_args:
        params:
          type: tax
          Gt_prob: 0.171
        tax:
          initial_action:
            Gt_prob: 0.171
    - entity_name: households
      entity_args:
        params:
          type: ramsey
          households_n: 1000
          freeze_labor_efficiency: true # 固定效率；劳动动作由下面的 initial 规则提供
    - entity_name: market
      entity_args:
        params:
          type: perfect
          sigma_z: 0.0
          epsilon: 0.5
    - entity_name: bank
      entity_args:
        params:
          type: non_profit
          lending_rate: 0.01683
          deposit_rate: 0.01683
          base_interest_rate: 0.01683
          reserve_ratio: 0.0
          depreciation_rate: 0.06
          capital_adjustment_speed: 0.05
          max_net_capital_growth: 0.05
          firm_accounting: true
Trainer:
  house_alg: rule_based
  household_rule: fixed_consumption    # 切换为 age_profile 可使用旧年龄/国家抽样规则
  household_consumption_share: 0.95    # 消费税后收入的 95%，剩余留在银行
  household_labor_rule: initial        # initial / constant / scf，分别对应独立规则函数
  household_labor_share: 0.5           # 仅在 constant 时生效
  household_country: US               # 仅在 age_profile 时生效
  gov_alg: us_federal
  firm_alg: rule_based
  bank_alg: rule_based
  seed: 2
  epoch_length: 27
  eval_episodes: 1
  cuda: false
  test: true
